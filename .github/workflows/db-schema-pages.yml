name: DB Schema Sync & Pages

# Keeps docs/db-schema in sync with the upstream EF model snapshot
# (nightscout/nocturne@main) and publishes it to GitHub Pages.
#
# On each run it regenerates the chart from upstream. On scheduled / manual
# runs it also commits any change back to this branch (the schema snapshot
# upstream changes roughly once a day, so we check daily). On push runs it
# only deploys. If regeneration fails, the committed copy is deployed, so the
# site is never broken.
#
# NOTE: `schedule:` triggers only fire from a repository's DEFAULT branch, so
# the daily sync below only runs automatically once this workflow also lives on
# the default branch. From this feature branch, use "Run workflow" (dispatch)
# or a push; both work immediately.

on:
  push:
    branches: ["claude/upstream-dev-db-schema-fd0uh7"]
    paths:
      - "docs/db-schema/**"
      - ".github/workflows/db-schema-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * *"   # daily 05:27 UTC (default-branch only; see note)

permissions:
  contents: write          # allows committing synced schema back to the branch
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/upstream-dev-db-schema-fd0uh7   # always sync THIS branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Provide Chromium for mermaid-cli
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Regenerate from upstream (best-effort)
        id: regen
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          OUTDIR: ${{ github.workspace }}/docs/db-schema
        run: |
          bash docs/db-schema/tools/build.sh

      - name: Sync schema back to the branch (scheduled/manual only)
        if: ${{ github.event_name != 'push' }}
        run: |
          if [ -n "$(git status --porcelain docs/db-schema)" ]; then
            echo "Upstream schema changed — committing."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/db-schema
            git commit -m "chore(db-schema): sync with upstream nightscout/nocturne@main"
            git push origin HEAD:claude/upstream-dev-db-schema-fd0uh7
          else
            echo "No schema changes since last sync."
          fi

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/db-schema

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
